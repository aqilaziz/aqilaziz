name: Update profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update open source metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: aqilaziz
        run: node scripts/update-open-source-metrics.js

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain assets/open-source-metrics.svg)" ]; then
            echo "No profile metric changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/open-source-metrics.svg
          git commit -m "Update profile metrics"
          git push
