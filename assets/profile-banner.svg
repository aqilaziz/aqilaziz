<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aqil Aziz - Educator and AI/full-stack builder</title>
  <desc id="desc">A modern GitHub profile banner with a data grid, technology nodes, and Aqil Aziz profile text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.52" stop-color="#12313A"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#E5E7EB" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="28" fill="url(#grid)"/>

  <circle cx="1330" cy="118" r="170" fill="#38BDF8" opacity="0.09" filter="url(#soft)"/>
  <circle cx="1020" cy="330" r="130" fill="#F59E0B" opacity="0.10" filter="url(#soft)"/>

  <path d="M870 120 C950 54 1055 92 1125 156 C1195 220 1280 234 1375 164" stroke="url(#line)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <path d="M892 282 C965 232 1040 240 1112 290 C1190 344 1272 348 1378 284" stroke="#94A3B8" stroke-width="2" opacity="0.34"/>
  <path d="M922 144 L1010 98 L1125 156 L1198 224 L1308 170 L1375 164" stroke="#E2E8F0" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M940 282 L1038 246 L1112 290 L1206 310 L1318 286 L1378 284" stroke="#E2E8F0" stroke-opacity="0.18" stroke-width="2"/>

  <g fill="#67E8F9">
    <circle cx="870" cy="120" r="9"/>
    <circle cx="1010" cy="98" r="8"/>
    <circle cx="1125" cy="156" r="9"/>
    <circle cx="1198" cy="224" r="7"/>
    <circle cx="1308" cy="170" r="10"/>
    <circle cx="1375" cy="164" r="8"/>
  </g>
  <g fill="#FBBF24">
    <circle cx="922" cy="144" r="7"/>
    <circle cx="1038" cy="246" r="8"/>
    <circle cx="1206" cy="310" r="7"/>
    <circle cx="1318" cy="286" r="9"/>
  </g>

  <text x="92" y="126" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="800">Aqil Aziz</text>
  <text x="96" y="178" fill="#BAE6FD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">Educator & AI/full-stack builder</text>
  <text x="96" y="232" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23">React / Supabase / Python / SQL / Cloud / GenAI</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">
    <rect x="96" y="280" width="154" height="46" rx="23" fill="#0EA5E9" fill-opacity="0.18" stroke="#7DD3FC"/>
    <text x="126" y="310" fill="#E0F2FE">AI tools</text>
    <rect x="270" y="280" width="156" height="46" rx="23" fill="#14B8A6" fill-opacity="0.17" stroke="#5EEAD4"/>
    <text x="298" y="310" fill="#CCFBF1">Supabase</text>
    <rect x="446" y="280" width="184" height="46" rx="23" fill="#F59E0B" fill-opacity="0.18" stroke="#FCD34D"/>
    <text x="494" y="310" fill="#FEF3C7">React apps</text>
    <rect x="650" y="280" width="196" height="46" rx="23" fill="#A78BFA" fill-opacity="0.16" stroke="#C4B5FD"/>
    <text x="680" y="310" fill="#EDE9FE">EdTech focus</text>
  </g>

  <g transform="translate(1188 70)">
    <rect width="284" height="250" rx="24" fill="#020617" fill-opacity="0.46" stroke="#38BDF8" stroke-opacity="0.55"/>
    <text x="34" y="56" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">LEARN</text>
    <text x="34" y="106" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">build</text>
    <text x="34" y="154" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">measure</text>
    <text x="34" y="202" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">share</text>
    <path d="M190 60 L230 60 L230 202 L190 202" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M206 108 L230 132 L206 156" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
