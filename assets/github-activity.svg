<svg width="900" height="230" viewBox="0 0 900 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aqil Aziz GitHub activity summary</title>
  <desc id="desc">A compact activity card showing public repositories, yearly contributions, learning focus, and GitHub member since 2019.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="900" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.58" stop-color="#102F3A"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#E2E8F0" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="230" rx="18" fill="url(#card)"/>
  <rect width="900" height="230" rx="18" fill="url(#grid)"/>

  <text x="34" y="48" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">GitHub activity</text>
  <text x="34" y="78" fill="#BAE6FD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Project-based learning across AI, data, cloud, and full-stack development</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="34" y="106" width="188" height="82" rx="14" fill="#020617" fill-opacity="0.38" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="58" y="138" fill="#93C5FD" font-size="14" font-weight="700">PUBLIC REPOS</text>
    <text x="58" y="171" fill="#F8FAFC" font-size="34" font-weight="800">120+</text>

    <rect x="246" y="106" width="188" height="82" rx="14" fill="#020617" fill-opacity="0.38" stroke="#34D399" stroke-opacity="0.45"/>
    <text x="270" y="138" fill="#A7F3D0" font-size="14" font-weight="700">CONTRIBUTIONS</text>
    <text x="270" y="171" fill="#F8FAFC" font-size="34" font-weight="800">700+</text>

    <rect x="458" y="106" width="188" height="82" rx="14" fill="#020617" fill-opacity="0.38" stroke="#F59E0B" stroke-opacity="0.48"/>
    <text x="482" y="138" fill="#FDE68A" font-size="14" font-weight="700">FOCUS</text>
    <text x="482" y="171" fill="#F8FAFC" font-size="30" font-weight="800">AI + Data</text>

    <rect x="670" y="106" width="196" height="82" rx="14" fill="#020617" fill-opacity="0.38" stroke="#C4B5FD" stroke-opacity="0.48"/>
    <text x="694" y="138" fill="#DDD6FE" font-size="14" font-weight="700">MEMBER SINCE</text>
    <text x="694" y="171" fill="#F8FAFC" font-size="34" font-weight="800">2019</text>
  </g>
</svg>
